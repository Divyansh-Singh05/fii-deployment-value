[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convgap"
version = "0.1.0"
description = "Measuring the conversion of statistical significance into forecasting value in financial models"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Divyansh Singh" }]
keywords = ["forecast evaluation", "backtesting", "model validation", "empirical finance"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "polars>=1.0",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "types-PyYAML>=6.0", "pandas-stubs>=2.1"]

[project.scripts]
convgap = "convgap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/convgap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[[tool.mypy.overrides]]
module = ["statsmodels.*", "polars.*"]
ignore_missing_imports = true
