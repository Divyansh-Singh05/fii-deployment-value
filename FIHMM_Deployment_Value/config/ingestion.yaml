# ONE-TIME INGESTION ONLY. NOT READ AT RUNTIME.
#
# This is the only file in the package that names a path outside it. It is
# consumed exclusively by `python -m src.data.ingest`, which copies and derives
# the dataset into data/ once. After that the package is self-contained: every
# runtime module resolves its inputs through config/paths.yaml, which contains
# only package-relative paths.
#
# If these trees are absent, ingestion cannot run - but everything already in
# data/ still works, because nothing at runtime looks here.

